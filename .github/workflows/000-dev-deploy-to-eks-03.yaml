name: "2-LOCALSTACK Deploy Apps to EKS"

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS Region (e.g., us-east-1)"
        required: true
        default: "us-east-1"
      cluster_name:
        description: "EKS Cluster Name (e.g., local-eks-demo)"
        required: true
        default: "local-eks-demo"

jobs:
  deploy-to-eks:
    name: "Deploy ALB Controller and ArgoCD (LocalStack)"
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ github.event.inputs.aws_region }}
      LOCAL_ENDPOINT: "http://host.docker.internal:4566"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install || ./aws/install

      - name: Install Argo Rollouts kubectl plugin
        run: |
          echo "=========================================="
          echo "Installing Argo Rollouts CLI"
          echo "=========================================="
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x ./kubectl-argo-rollouts-linux-amd64
          sudo mv ./kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

      - name: Install kubectl and Helm
        run: |
          echo "=========================================="
          echo "Installing kubectl and Helm"
          echo "=========================================="
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh || sudo ./get_helm.sh

      # -----------------------------------------------------------------------------------
      # 1. Connect to the EKS Cluster
      # -----------------------------------------------------------------------------------
      - name: Update Kubeconfig
        run: |
          echo "=========================================="
          echo "Connecting to Local EKS Cluster"
          echo "=========================================="
          aws --endpoint-url=$LOCAL_ENDPOINT eks update-kubeconfig \
            --region ${{ github.event.inputs.aws_region }} \
            --name ${{ github.event.inputs.cluster_name }}

      # -----------------------------------------------------------------------------------
      # 2. Install Argo Rollouts Controller
      # -----------------------------------------------------------------------------------
      - name: Install Argo Rollouts Controller
        run: |
          echo "=========================================="
          echo "Installing Argo Rollouts Controller"
          echo "=========================================="
          kubectl create namespace argo-rollouts || true
          kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argo-rollouts -n argo-rollouts --timeout=300s

      # -----------------------------------------------------------------------------------
      # 3. Install AWS Load Balancer Controller
      # -----------------------------------------------------------------------------------
      - name: Install AWS Load Balancer Controller
        run: |
          echo "=========================================="
          echo "Installing AWS Load Balancer Controller via Helm"
          echo "=========================================="

          VPC_ID=$(aws --endpoint-url=$LOCAL_ENDPOINT eks describe-cluster --name ${{ github.event.inputs.cluster_name }} --query "cluster.resourcesVpcConfig.vpcId" --output text)

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=${{ github.event.inputs.cluster_name }} \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set vpcId=$VPC_ID \
            --set region=${{ github.event.inputs.aws_region }} \
            --set enableServiceMutatorWebhook=false \
            --set env.AWS_ENDPOINT_URL="http://host.docker.internal:4566" \
            --set env.AWS_ACCESS_KEY_ID="test" \
            --set env.AWS_SECRET_ACCESS_KEY="test"

          sleep 20

      # -----------------------------------------------------------------------------------
      # 4. Install ExternalDNS
      # -----------------------------------------------------------------------------------
      - name: Install ExternalDNS
        run: |
          echo "=========================================="
          echo "Installing ExternalDNS for Route 53 Automation"
          echo "=========================================="

          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo update

          helm upgrade --install external-dns external-dns/external-dns \
            --namespace kube-system \
            --set provider=aws \
            --set aws.zoneType=public \
            --set txtOwnerId=${{ github.event.inputs.cluster_name }} \
            --set domainFilters[0]=trialphase.shop \
            --set policy=sync \
            --set env[0].name=AWS_ENDPOINT_URL \
            --set env[0].value="http://host.docker.internal:4566" \
            --set env[1].name=AWS_ACCESS_KEY_ID \
            --set env[1].value="test" \
            --set env[2].name=AWS_SECRET_ACCESS_KEY \
            --set env[2].value="test" \
            --set env[3].name=AWS_DEFAULT_REGION \
            --set env[3].value=${{ github.event.inputs.aws_region }}
            
          sleep 15

      # -----------------------------------------------------------------------------------
      # 5. Install ArgoCD
      # -----------------------------------------------------------------------------------
      - name: Install ArgoCD
        run: |
          echo "=========================================="
          echo "Installing ArgoCD"
          echo "=========================================="

          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --set server.service.type=ClusterIP \
            --set server.extraArgs={--insecure}

          sleep 30

      # -----------------------------------------------------------------------------------
      # 6. Apply Core Cluster Manifests & App of Apps
      # -----------------------------------------------------------------------------------
      - name: Spark the GitOps Pipeline
        run: |
          echo "=========================================="
          echo "Applying the App of Apps Architecture"
          echo "=========================================="

          kubectl apply -f kubernetes-manifests/argocd-ingress.yaml || echo "Could not find argocd-ingress.yaml"
          kubectl apply -f argocd/root-app.yaml

      # -----------------------------------------------------------------------------------
      # 7. Await ALB and Print Credentials
      # -----------------------------------------------------------------------------------
      - name: Fetch DNS and Credentials
        run: |
          echo "=========================================="
          echo "Waiting for LocalStack ALB to provision..."
          echo "=========================================="

          MAX_RETRIES=18
          RETRIES=0
          while [[ -z $(kubectl get ingress argocd-server-ingress -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null) ]]; do
            echo "ALB not ready yet... waiting 10 seconds..."
            sleep 10
            RETRIES=$((RETRIES+1))
            if [ $RETRIES -ge $MAX_RETRIES ]; then
              break
            fi
          done

          ALB_HOSTNAME=$(kubectl get ingress argocd-server-ingress -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)

          echo ""
          echo "✅ DEPLOYMENT COMPLETE!"
          echo "------------------------------------------"
          echo "🌐 ALB DNS URL : $ALB_HOSTNAME"
          echo "👤 Username    : admin"
          echo "🔑 Password    : $PASSWORD"
          echo "------------------------------------------"
