version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "538153606685"
    AWS_DEFAULT_REGION: "us-east-1"
    IMAGE_REPO_NAME: "currency_converter"
    IMAGE_TAG: ${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}
    ECR_REPO_URI: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}
  secrets-manager:
    GITHUB_TOKEN: "github-personal-access-token:token"

phases:
  install:
    runtime-versions:
      python: 3.9
      docker: 20
    commands:
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "Running unit tests..."
      - python -m pytest tests/test_app.py
      - echo "Building the Docker image..."
      - docker build -t $ECR_REPO_URI:$IMAGE_TAG .
      - docker tag $ECR_REPO_URI:$IMAGE_TAG $ECR_REPO_URI:latest

  post_build:
    commands:
      - echo "Pushing the Docker images to ECR..."
      - docker push $ECR_REPO_URI:$IMAGE_TAG
      - docker push $ECR_REPO_URI:latest
      # Execute the script to handle the Git operations
      - echo "Executing manifest update script..."
      - chmod +x scripts/update_and_commit.sh
      - ./scripts/update_and_commit.sh

artifacts:
  files: []
