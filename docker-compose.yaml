    image: localstack/localstack-pro:latest

    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"

    environment:
      LOCALSTACK_AUTH_TOKEN: "ls-ZOlItiTe-JAKa-dOdU-6283-bEyafIGA2f7b"
